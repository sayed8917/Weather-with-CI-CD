<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --glass: rgba(255,255,255,0.08);
      --glass-border: rgba(255,255,255,0.12);
      --glass-hover: rgba(255,255,255,0.14);
      --text: #f0f0f0;
      --text-dim: rgba(255,255,255,0.5);
      --accent: #60a5fa;
      --accent2: #a78bfa;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      background: #0f172a;
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(59,130,246,0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(139,92,246,0.2) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(16,185,129,0.1) 0%, transparent 60%);
      z-index: -1;
      animation: bgShift 20s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.7; transform: scale(1.1); }
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    /* ---- header ---- */
    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .header .date {
      font-size: 14px;
      color: var(--text-dim);
      font-weight: 400;
    }

    /* ---- search ---- */
    .search-wrap {
      position: relative;
      max-width: 480px;
      margin: 0 auto 36px;
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 14px 20px 14px 46px;
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(96,165,250,0.15);
    }

    .search-box input::placeholder { color: var(--text-dim); }

    .search-box .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: var(--text-dim);
      pointer-events: none;
    }

    .search-box button {
      padding: 0 22px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
    }

    .search-box button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(96,165,250,0.35);
    }

    .suggestions {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      list-style: none;
      background: rgba(15,23,42,0.95);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      overflow: hidden;
      backdrop-filter: blur(20px);
      display: none;
      z-index: 10;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }

    .suggestions.show { display: block; }

    .suggestions li {
      padding: 12px 18px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
    }

    .suggestions li:hover { background: var(--glass-hover); }

    .suggestions li .meta {
      color: var(--text-dim);
      font-size: 12px;
      margin-left: 4px;
    }

    .hidden { display: none !important; }

    /* ---- error ---- */
    .error {
      text-align: center;
      color: #fca5a5;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.2);
      padding: 12px 16px;
      border-radius: 14px;
      margin-bottom: 24px;
      font-size: 14px;
    }

    /* ---- loading ---- */
    .loading {
      display: flex;
      justify-content: center;
      padding: 60px 0;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--glass);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- glass card ---- */
    .card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 28px;
      backdrop-filter: blur(20px);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }

    .card-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    /* ---- main grid ---- */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    /* ---- hero card ---- */
    .hero-card {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 32px 36px;
    }

    .hero-left h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .hero-left .desc {
      font-size: 15px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .hero-left .feels {
      font-size: 13px;
      color: var(--text-dim);
    }

    .hero-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .hero-icon {
      font-size: 80px;
      line-height: 1;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .hero-temp {
      font-size: 84px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(180deg, #fff 30%, rgba(255,255,255,0.5));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-temp small {
      font-size: 32px;
      font-weight: 400;
    }

    /* ---- stats grid ---- */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 14px 16px;
      transition: background 0.2s;
    }

    .stat:hover { background: rgba(255,255,255,0.08); }

    .stat .label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .stat .value {
      font-size: 20px;
      font-weight: 700;
    }

    .stat .unit {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-dim);
      margin-left: 2px;
    }

    /* ---- hourly ---- */
    .hourly-section {
      margin-bottom: 16px;
    }

    .hourly-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }

    .hourly-scroll::-webkit-scrollbar { height: 4px; }
    .hourly-scroll::-webkit-scrollbar-track { background: transparent; }
    .hourly-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

    .hour-card {
      min-width: 76px;
      text-align: center;
      padding: 14px 10px;
      border-radius: 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .hour-card:hover { background: rgba(255,255,255,0.1); }

    .hour-card .h-time {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .hour-card .h-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .hour-card .h-temp {
      font-size: 15px;
      font-weight: 600;
    }

    /* ---- forecast ---- */
    .forecast-section {
      margin-bottom: 16px;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .day-card {
      text-align: center;
      padding: 16px 8px;
      border-radius: 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.06);
      transition: background 0.2s, transform 0.2s;
    }

    .day-card:hover {
      background: rgba(255,255,255,0.1);
      transform: translateY(-2px);
    }

    .day-card .day-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .day-card .day-icon {
      font-size: 30px;
      margin: 10px 0;
    }

    .day-card .hi {
      font-size: 17px;
      font-weight: 700;
    }

    .day-card .lo {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .day-card .rain {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      color: var(--accent);
      margin-top: 8px;
    }

    /* ---- bottom row ---- */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .sun-info {
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .sun-item .sun-label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .sun-item .sun-value {
      font-size: 22px;
      font-weight: 700;
    }

    .uv-bar {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, #22c55e, #eab308, #f97316, #ef4444, #a855f7);
      margin-top: 12px;
      position: relative;
    }

    .uv-bar .uv-marker {
      position: absolute;
      top: -3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #0f172a;
      transform: translateX(-50%);
      transition: left 0.5s ease;
    }

    .uv-info {
      text-align: center;
      margin-top: 10px;
    }

    .uv-info .uv-val {
      font-size: 36px;
      font-weight: 800;
    }

    .uv-info .uv-label {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* ---- responsive ---- */
    @media (max-width: 768px) {
      .container { padding: 24px 16px 40px; }
      .header h1 { font-size: 22px; }
      .hero-card { flex-direction: column; text-align: center; gap: 20px; padding: 28px 24px; }
      .hero-right { justify-content: center; }
      .hero-temp { font-size: 68px; }
      .hero-icon { font-size: 64px; }
      .main-grid { grid-template-columns: 1fr; }
      .forecast-grid { grid-template-columns: repeat(4, 1fr); }
      .bottom-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .forecast-grid { grid-template-columns: repeat(2, 1fr); }
      .stats-grid { grid-template-columns: 1fr; }
    }

    /* ---- fade in ---- */
    .fade-in {
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .delay-1 { animation-delay: 0.05s; }
    .delay-2 { animation-delay: 0.1s; }
    .delay-3 { animation-delay: 0.15s; }
    .delay-4 { animation-delay: 0.2s; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Weather Report</h1>
      <div class="date" id="current-date"></div>
    </div>

    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <div class="search-box">
        <input id="city-input" type="text" placeholder="Search any city..." autocomplete="off" />
        <button id="search-btn">Go</button>
      </div>
      <ul id="suggestions" class="suggestions"></ul>
    </div>

    <div id="error" class="error hidden"></div>

    <div id="loading" class="loading hidden"><div class="spinner"></div></div>

    <div id="dashboard" class="hidden">
      <div class="main-grid fade-in">
        <div class="card hero-card">
          <div class="hero-left">
            <h2 id="city"></h2>
            <div class="desc" id="description"></div>
            <div class="feels" id="feels-like"></div>
          </div>
          <div class="hero-right">
            <div class="hero-icon" id="current-icon"></div>
            <div class="hero-temp" id="current-temp"></div>
          </div>
        </div>

        <div class="card fade-in delay-1">
          <div class="card-label">Details</div>
          <div class="stats-grid">
            <div class="stat">
              <div class="label">Humidity</div>
              <div class="value" id="humidity"></div>
            </div>
            <div class="stat">
              <div class="label">Wind</div>
              <div class="value" id="wind"></div>
            </div>
            <div class="stat">
              <div class="label">Pressure</div>
              <div class="value" id="pressure"></div>
            </div>
            <div class="stat">
              <div class="label">Precipitation</div>
              <div class="value" id="precipitation"></div>
            </div>
          </div>
        </div>

        <div class="card fade-in delay-2">
          <div class="card-label">UV Index</div>
          <div class="uv-info">
            <div class="uv-val" id="uv-index"></div>
            <div class="uv-label" id="uv-level"></div>
          </div>
          <div class="uv-bar"><div class="uv-marker" id="uv-marker"></div></div>
        </div>
      </div>

      <div class="card hourly-section fade-in delay-2">
        <div class="card-label">Next 12 Hours</div>
        <div class="hourly-scroll" id="hourly-list"></div>
      </div>

      <div class="card forecast-section fade-in delay-3">
        <div class="card-label">7-Day Forecast</div>
        <div class="forecast-grid" id="forecast-list"></div>
      </div>

      <div class="bottom-grid fade-in delay-4">
        <div class="card">
          <div class="card-label">Sun</div>
          <div class="sun-info">
            <div class="sun-item">
              <div class="sun-label">Sunrise</div>
              <div class="sun-value" id="sunrise"></div>
            </div>
            <div class="sun-item">
              <div class="sun-label">Sunset</div>
              <div class="sun-value" id="sunset"></div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-label">Wind Direction</div>
          <div class="sun-info">
            <div class="sun-item">
              <div class="sun-label">Direction</div>
              <div class="sun-value" id="wind-dir"></div>
            </div>
            <div class="sun-item">
              <div class="sun-label">Speed</div>
              <div class="sun-value" id="wind-speed"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById('city-input');
    const suggestionsEl = document.getElementById('suggestions');
    const errorEl = document.getElementById('error');
    const dashboard = document.getElementById('dashboard');
    const loadingEl = document.getElementById('loading');

    document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    const WEATHER_CODES = {
      0: ['☀️','Clear sky'], 1: ['🌤️','Mainly clear'], 2: ['⛅','Partly cloudy'], 3: ['☁️','Overcast'],
      45: ['🌫️','Fog'], 48: ['🌫️','Rime fog'], 51: ['🌦️','Light drizzle'], 53: ['🌦️','Drizzle'],
      55: ['🌧️','Dense drizzle'], 61: ['🌧️','Light rain'], 63: ['🌧️','Rain'], 65: ['🌧️','Heavy rain'],
      66: ['🌧️','Freezing rain'], 67: ['🌧️','Freezing rain'], 71: ['❄️','Light snow'], 73: ['❄️','Snow'],
      75: ['❄️','Heavy snow'], 77: ['🌨️','Snow grains'], 80: ['🌦️','Light showers'],
      81: ['🌧️','Showers'], 82: ['🌧️','Violent showers'], 85: ['🌨️','Snow showers'],
      86: ['🌨️','Heavy snow'], 95: ['⛈️','Thunderstorm'], 96: ['⛈️','Thunderstorm + hail'],
      99: ['⛈️','Thunderstorm + heavy hail']
    };

    const WIND_DIRS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];

    function weatherInfo(code, isDay) {
      const info = WEATHER_CODES[code] || ['🌈','Unknown'];
      return { icon: (code === 0 && !isDay) ? '🌙' : info[0], label: info[1] };
    }

    function windDir(deg) { return WIND_DIRS[Math.round(deg / 22.5) % 16]; }

    function formatTime(t) {
      return new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
      setTimeout(() => errorEl.classList.add('hidden'), 4000);
    }

    let debounceTimer;

    async function doSearch(q) {
      if (!q) return;
      const res = await fetch('/api/search?q=' + encodeURIComponent(q));
      const data = await res.json();
      if (!res.ok) { showError(data.error || 'Search failed'); return; }
      renderSuggestions(data.results);
    }

    function renderSuggestions(results) {
      suggestionsEl.innerHTML = '';
      if (!results.length) { suggestionsEl.classList.remove('show'); return; }
      results.forEach(r => {
        const li = document.createElement('li');
        li.innerHTML = r.name + ' <span class="meta">' + (r.admin1 ? r.admin1 + ', ' : '') + r.country + '</span>';
        li.addEventListener('click', () => { suggestionsEl.classList.remove('show'); loadWeather(r); });
        suggestionsEl.appendChild(li);
      });
      suggestionsEl.classList.add('show');
    }

    async function loadWeather(place) {
      dashboard.classList.add('hidden');
      loadingEl.classList.remove('hidden');

      const res = await fetch('/api/weather?lat=' + place.latitude + '&lon=' + place.longitude);
      const data = await res.json();
      loadingEl.classList.add('hidden');

      if (!res.ok) { showError(data.error || 'Failed to load weather'); return; }

      document.getElementById('city').textContent = place.name + ', ' + place.country;

      const cur = data.current;
      const c = weatherInfo(cur.weather_code, cur.is_day);

      document.getElementById('current-icon').textContent = c.icon;
      document.getElementById('current-temp').innerHTML = Math.round(cur.temperature_2m) + '<small>°C</small>';
      document.getElementById('description').textContent = c.label;
      document.getElementById('feels-like').textContent = 'Feels like ' + Math.round(cur.apparent_temperature) + '°C';
      document.getElementById('humidity').innerHTML = Math.round(cur.relative_humidity_2m) + '<span class="unit">%</span>';
      document.getElementById('wind').innerHTML = Math.round(cur.wind_speed_10m) + '<span class="unit">km/h</span>';
      document.getElementById('pressure').innerHTML = Math.round(cur.pressure_msl) + '<span class="unit">hPa</span>';
      document.getElementById('precipitation').innerHTML = (cur.precipitation || 0) + '<span class="unit">mm</span>';
      document.getElementById('wind-dir').textContent = windDir(cur.wind_direction_10m);
      document.getElementById('wind-speed').innerHTML = Math.round(cur.wind_speed_10m) + '<span class="unit">km/h</span>';

      const maxUV = data.daily.uv_index_max[0];
      document.getElementById('uv-index').textContent = maxUV;
      document.getElementById('uv-level').textContent =
        maxUV >= 8 ? 'Very High' : maxUV >= 6 ? 'High' : maxUV >= 3 ? 'Moderate' : 'Low';
      document.getElementById('uv-marker').style.left = Math.min(maxUV / 11 * 100, 100) + '%';

      renderHourly(data);
      renderForecast(data);
      document.getElementById('sunrise').textContent = formatTime(data.daily.sunrise[0]);
      document.getElementById('sunset').textContent = formatTime(data.daily.sunset[0]);

      dashboard.classList.remove('hidden');
    }

    function renderHourly(data) {
      const el = document.getElementById('hourly-list');
      el.innerHTML = '';
      const { time, temperature_2m, weather_code } = data.hourly;
      for (let i = 0; i < 12 && i < time.length; i++) {
        const info = weatherInfo(weather_code[i], true);
        el.innerHTML += '<div class="hour-card">' +
          '<div class="h-time">' + new Date(time[i]).toLocaleTimeString([], { hour: 'numeric' }) + '</div>' +
          '<div class="h-icon">' + info.icon + '</div>' +
          '<div class="h-temp">' + Math.round(temperature_2m[i]) + '°</div></div>';
      }
    }

    function renderForecast(data) {
      const el = document.getElementById('forecast-list');
      el.innerHTML = '';
      const days = data.daily.time;
      for (let i = 0; i < days.length; i++) {
        const info = weatherInfo(data.daily.weather_code[i], true);
        const d = new Date(days[i] + 'T00:00:00');
        const name = i === 0 ? 'Today' : d.toLocaleDateString([], { weekday: 'short' });
        el.innerHTML += '<div class="day-card">' +
          '<div class="day-name">' + name + '</div>' +
          '<div class="day-icon">' + info.icon + '</div>' +
          '<div class="hi">' + Math.round(data.daily.temperature_2m_max[i]) + '°</div>' +
          '<div class="lo">' + Math.round(data.daily.temperature_2m_min[i]) + '°</div>' +
          '<div class="rain">💧 ' + (data.daily.precipitation_probability_max[i] || 0) + '%</div></div>';
      }
    }

    document.getElementById('search-btn').addEventListener('click', () => {
      const q = input.value.trim();
      if (q) doSearch(q);
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('search-btn').click();
    });

    input.addEventListener('input', () => {
      const q = input.value.trim();
      clearTimeout(debounceTimer);
      if (q.length < 2) { suggestionsEl.classList.remove('show'); return; }
      debounceTimer = setTimeout(() => doSearch(q), 400);
    });

    document.addEventListener('click', e => {
      if (!suggestionsEl.contains(e.target) && !input.contains(e.target)) suggestionsEl.classList.remove('show');
    });

    loadWeather({ name: 'Dhaka', country: 'Bangladesh', latitude: 23.8103, longitude: 90.4125 });
  </script>
</body>
</html>
