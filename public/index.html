<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Report</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #2b5876 0%, #4e4376 55%, #1d2b64 100%);
      color: #fff;
      padding: 30px 20px;
      transition: background 1s ease;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    .search-box {
      display: flex;
      gap: 12px;
      max-width: 520px;
      margin: 0 auto 32px;
    }

    .search-box input {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 16px;
      outline: none;
      backdrop-filter: blur(8px);
    }

    .search-box input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .search-box button {
      padding: 0 24px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #ff9a56, #ff6b6b);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .search-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .suggestions {
      max-width: 520px;
      margin: -18px auto 28px;
      list-style: none;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      display: none;
    }

    .suggestions.show {
      display: block;
    }

    .suggestions li {
      padding: 12px 20px;
      cursor: pointer;
      font-size: 15px;
    }

    .suggestions li:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .suggestions li .meta {
      color: rgba(255, 255, 255, 0.55);
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .error {
      text-align: center;
      color: #ffd2d2;
      background: rgba(255, 0, 0, 0.15);
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    .current {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 26px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      color: rgba(255, 255, 255, 0.75);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .curr-main {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .curr-icon {
      font-size: 74px;
      line-height: 1;
    }

    .curr-temp {
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
    }

    .curr-temp small {
      font-size: 28px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.7);
    }

    .curr-desc {
      font-size: 18px;
      margin-top: 4px;
      color: rgba(255, 255, 255, 0.9);
    }

    .curr-city {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .curr-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .stat .label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat .value {
      font-size: 18px;
      font-weight: 600;
      margin-top: 4px;
    }

    .forecast {
      margin-bottom: 24px;
    }

    .forecast-list {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
    }

    .day-card {
      text-align: center;
      padding: 16px 8px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .day-card .day-name {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
    }

    .day-card .day-icon {
      font-size: 32px;
      margin: 10px 0;
    }

    .day-card .hi {
      font-size: 18px;
      font-weight: 700;
    }

    .day-card .lo {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 2px;
    }

    .day-card .po {
      font-size: 12px;
      color: #8ed1fc;
      margin-top: 6px;
    }

    .hourly {
      margin-bottom: 24px;
    }

    .hourly-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .hourly-list::-webkit-scrollbar {
      height: 6px;
    }

    .hourly-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 3px;
    }

    .hour-card {
      min-width: 70px;
      text-align: center;
      padding: 12px 8px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .hour-card .hour {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .hour-card .h-icon {
      font-size: 22px;
      margin: 8px 0;
    }

    .hour-card .h-temp {
      font-size: 15px;
      font-weight: 600;
    }

    .sun-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      text-align: center;
    }

    .sun-card .stat .value {
      font-size: 20px;
    }

    @media (max-width: 720px) {
      .current {
        grid-template-columns: 1fr;
      }

      .forecast-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="search-box">
      <input id="city-input" type="text" placeholder="Search city (e.g. Dhaka, London)..." autocomplete="off" />
      <button id="search-btn">Search</button>
    </div>
    <ul id="suggestions" class="suggestions"></ul>
    <div id="error" class="error hidden"></div>

    <div id="dashboard" class="hidden">
      <section class="current">
        <div class="card">
          <div class="card-header">Current Conditions</div>
          <div class="curr-main">
            <div>
              <div class="curr-city" id="city"></div>
              <div class="curr-desc" id="description"></div>
              <div id="feels-like"></div>
            </div>
            <div class="curr-icon" id="current-icon"></div>
            <div class="curr-temp" id="current-temp"></div>
          </div>
        </div>
        <div class="card">
          <div class="card-header">Details</div>
          <div class="curr-stats">
            <div class="stat"><div class="label">Humidity</div><div class="value" id="humidity"></div></div>
            <div class="stat"><div class="label">Wind</div><div class="value" id="wind"></div></div>
            <div class="stat"><div class="label">Pressure</div><div class="value" id="pressure"></div></div>
            <div class="stat"><div class="label">Precipitation</div><div class="value" id="precipitation"></div></div>
          </div>
        </div>
      </section>

      <section class="hourly">
        <div class="card">
          <div class="card-header">Today's Outlook — Next 12 Hours</div>
          <div class="hourly-list" id="hourly-list"></div>
        </div>
      </section>

      <section class="forecast">
        <div class="card">
          <div class="card-header">7-Day Forecast</div>
          <div class="forecast-list" id="forecast-list"></div>
        </div>
      </section>

      <section class="sun-card">
        <div class="card">
          <div class="card-header">Sun</div>
          <div class="stat"><div class="label">Sunrise</div><div class="value" id="sunrise"></div></div>
          <div class="stat"><div class="label">Sunset</div><div class="value" id="sunset"></div></div>
        </div>
        <div class="card">
          <div class="card-header">UV Index (Max)</div>
          <div class="stat"><div class="value" id="uv-index"></div></div>
          <div class="stat"><div class="label">Today's Max</div><div class="value" id="uv-level"></div></div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const input = document.getElementById('city-input');
    const suggestionsEl = document.getElementById('suggestions');
    const errorEl = document.getElementById('error');
    const dashboard = document.getElementById('dashboard');

    const WEATHER_CODES = {
      0: ['☀️', 'Clear sky'],
      1: ['🌤️', 'Mainly clear'],
      2: ['⛅', 'Partly cloudy'],
      3: ['☁️', 'Overcast'],
      45: ['🌫️', 'Fog'],
      48: ['🌫️', 'Depositing rime fog'],
      51: ['🌦️', 'Light drizzle'],
      53: ['🌦️', 'Drizzle'],
      55: ['🌧️', 'Dense drizzle'],
      61: ['🌧️', 'Light rain'],
      63: ['🌧️', 'Rain'],
      65: ['🌧️', 'Heavy rain'],
      66: ['🌧️', 'Freezing rain'],
      67: ['🌧️', 'Freezing rain'],
      71: ['❄️', 'Light snow'],
      73: ['❄️', 'Snow'],
      75: ['❄️', 'Heavy snow'],
      77: ['🌨️', 'Snow grains'],
      80: ['🌦️', 'Light showers'],
      81: ['🌧️', 'Showers'],
      82: ['🌧️', 'Violent showers'],
      85: ['🌨️', 'Snow showers'],
      86: ['🌨️', 'Heavy snow showers'],
      95: ['⛈️', 'Thunderstorm'],
      96: ['⛈️', 'Thunderstorm w/ hail'],
      99: ['⛈️', 'Thunderstorm w/ heavy hail'],
    };

    function weatherInfo(code, isDay) {
      const info = WEATHER_CODES[code] || ['🌈', 'Unknown'];
      let icon = info[0];
      if (code === 0 && !isDay) icon = '🌙';
      return { icon, label: info[1] };
    }

    function formatTime(t) {
      return new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    let debounceTimer;

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
      setTimeout(() => errorEl.classList.add('hidden'), 4000);
    }

    async function doSearch(q) {
      if (!q) return;
      const res = await fetch('/api/search?q=' + encodeURIComponent(q));
      const data = await res.json();
      if (!res.ok) {
        showError(data.error || 'Search failed');
        return;
      }
      renderSuggestions(data.results);
    }

    function renderSuggestions(results) {
      suggestionsEl.innerHTML = '';
      if (results.length === 0) {
        suggestionsEl.classList.remove('show');
        return;
      }
      results.forEach((r) => {
        const li = document.createElement('li');
        li.innerHTML = r.name + ' <span class="meta">' + (r.admin1 ? r.admin1 + ', ' : '') + r.country + '</span>';
        li.addEventListener('click', () => {
          suggestionsEl.classList.remove('show');
          loadWeather(r);
        });
        suggestionsEl.appendChild(li);
      });
      suggestionsEl.classList.add('show');
    }

    async function loadWeather(place) {
      dashboard.classList.add('hidden');
      const res = await fetch('/api/weather?lat=' + place.latitude + '&lon=' + place.longitude);
      const data = await res.json();
      if (!res.ok) {
        showError(data.error || 'Failed to load weather');
        return;
      }
      const cityPart = place.admin1 ? place.admin1 + ', ' : '';
      document.getElementById('city').textContent = place.name + ', ' + place.country;

      const current = data.current;
      const c = weatherInfo(current.weather_code, current.is_day);

      document.getElementById('current-icon').textContent = c.icon;
      document.getElementById('current-temp').innerHTML = Math.round(current.temperature_2m) + '<small>°C</small>';
      document.getElementById('description').textContent = c.label;
      document.getElementById('feels-like').textContent = 'Feels like ' + Math.round(current.apparent_temperature) + '°';
      document.getElementById('humidity').textContent = Math.round(current.relative_humidity_2m) + '%';
      document.getElementById('wind').textContent = Math.round(current.wind_speed_10m) + ' km/h';
      document.getElementById('pressure').textContent = Math.round(current.pressure_msl) + ' hPa';
      document.getElementById('precipitation').textContent = (current.precipitation || 0) + ' mm';

      renderHourly(data);
      renderForecast(data);
      renderSun(data);

      const maxUV = data.daily.uv_index_max[0];
      document.getElementById('uv-index').textContent = maxUV;
      document.getElementById('uv-level').textContent =
        maxUV >= 8 ? 'Very High' : maxUV >= 6 ? 'High' : maxUV >= 3 ? 'Moderate' : 'Low';

      dashboard.classList.remove('hidden');
    }

    function renderHourly(data) {
      const listEl = document.getElementById('hourly-list');
      listEl.innerHTML = '';
      const times = data.hourly.time;
      const temps = data.hourly.temperature_2m;
      const codes = data.hourly.weather_code;
      for (let i = 0; i < 12 && i < times.length; i++) {
        const card = document.createElement('div');
        card.className = 'hour-card';
        const hour = new Date(times[i]).toLocaleTimeString([], { hour: 'numeric' });
        const info = weatherInfo(codes[i], true);
        card.innerHTML =
          '<div class="hour">' + hour + '</div>' +
          '<div class="h-icon">' + info.icon + '</div>' +
          '<div class="h-temp">' + Math.round(temps[i]) + '°</div>';
        listEl.appendChild(card);
      }
    }

    function renderForecast(data) {
      const listEl = document.getElementById('forecast-list');
      listEl.innerHTML = '';
      const days = data.daily.time;
      for (let i = 0; i < days.length; i++) {
        const info = weatherInfo(data.daily.weather_code[i], true);
        const date = new Date(days[i] + 'T00:00:00');
        const name = i === 0 ? 'Today' : date.toLocaleDateString([], { weekday: 'short' });
        const card = document.createElement('div');
        card.className = 'day-card';
        card.innerHTML =
          '<div class="day-name">' + name + '</div>' +
          '<div class="day-icon">' + info.icon + '</div>' +
          '<div class="hi">' + Math.round(data.daily.temperature_2m_max[i]) + '°</div>' +
          '<div class="lo">' + Math.round(data.daily.temperature_2m_min[i]) + '°</div>' +
          '<div class="po">☔ ' + (data.daily.precipitation_probability_max[i] || 0) + '%</div>';
        listEl.appendChild(card);
      }
    }

    function renderSun(data) {
      document.getElementById('sunrise').textContent = formatTime(data.daily.sunrise[0]);
      document.getElementById('sunset').textContent = formatTime(data.daily.sunset[0]);
    }

    document.getElementById('search-btn').addEventListener('click', () => {
      const q = input.value.trim();
      if (q) doSearch(q);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('search-btn').click();
    });

    input.addEventListener('input', () => {
      const q = input.value.trim();
      clearTimeout(debounceTimer);
      if (q.length < 2) {
        suggestionsEl.classList.remove('show');
        return;
      }
      debounceTimer = setTimeout(() => doSearch(q), 400);
    });

    document.addEventListener('click', (e) => {
      if (!suggestionsEl.contains(e.target) && !input.contains(e.target)) {
        suggestionsEl.classList.remove('show');
      }
    });

    loadWeather({ name: 'Dhaka', country: 'Bangladesh', latitude: 23.8103, longitude: 90.4125 });
  </script>
</body>
</html>
